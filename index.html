<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tableros comerciales P&amp;G</title>
<link rel="icon" href="img/logo-pg.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&display=swap">
<style>
:root{
  color-scheme:light;
  --font:"IBM Plex Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --navy:#0b2f6e;--navy2:#123f8c;--text:#1f2a3c;--muted:#5d687c;
  --azul:#1366d6;--azul-s:#e3eefc;--azul-t:#1458c4;
  --verde:#1f8a3b;--verde-s:#e2f3e7;--verde-t:#1e7a3c;
  --morado:#5a2ca0;--morado-s:#ece5f8;--morado-t:#5b2f9a;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:var(--font);color:var(--text);font-size:15px;line-height:1.45;background:#eaf1fc}
[hidden]{display:none!important}

/* Fondo de triángulos animados */
#fondo{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;display:block;background:linear-gradient(180deg,#f4f7fc 0%,#edf2fb 60%,#e6eefa 100%)}
.wrap{min-height:100%;max-width:1360px;margin:0 auto;padding:clamp(12px,2.6vh,26px) clamp(12px,2.2vw,30px) clamp(14px,2.4vh,24px);display:flex;flex-direction:column;gap:clamp(16px,3.2vh,34px)}

/* Encabezado */
.hero{position:relative;overflow:hidden;border-radius:18px;color:#fff;padding:clamp(14px,2.4vh,22px) clamp(18px,3vw,40px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;
  background:linear-gradient(105deg,#0a3a8e 0%,#0f4aa8 45%,#1660cf 100%);box-shadow:0 10px 30px rgba(10,50,130,.28)}
.hero::before{content:"";position:absolute;right:-8%;top:-60%;width:46%;height:220%;border-radius:50%;background:radial-gradient(closest-side,rgba(120,180,255,.35),rgba(120,180,255,0));pointer-events:none}
.hero::after{content:"";position:absolute;right:16%;top:-40%;width:30%;height:200%;border-radius:50%;border-left:2px solid rgba(255,255,255,.12);pointer-events:none}
.tt{position:relative;z-index:1;min-width:0;flex:1 1 32rem}
.tline{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
h1{margin:0;font-size:clamp(1.55rem,3.5vw,3rem);font-weight:700;letter-spacing:.01em;line-height:1.05;text-transform:uppercase}
.sep{width:2px;align-self:stretch;min-height:1.6em;background:rgba(255,255,255,.55);border-radius:2px}
.per{font-size:clamp(1.35rem,3vw,2.6rem);font-weight:700;line-height:1;padding:.14em .62em;border-radius:14px;background:rgba(80,140,235,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);white-space:nowrap}
.desc{margin:10px 0 0;font-size:clamp(.82rem,1.15vw,1rem);opacity:.96}
.desc b{font-weight:700}
.logos{position:relative;z-index:1;display:flex;align-items:center;gap:clamp(12px,1.8vw,22px);flex:0 0 auto}
.logos .pg{height:clamp(52px,6.4vw,92px);width:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
.logos .vsep{width:2px;height:clamp(40px,5vw,64px);background:rgba(255,255,255,.65);border-radius:2px}
.logos .vega{height:clamp(38px,4.6vw,66px);width:auto}

/* Tarjetas */
.boards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,1.6vw,22px);align-items:stretch}
.card{--k:var(--azul);--ks:var(--azul-s);--kt:var(--azul-t);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:clamp(10px,1.8vh,16px);
  background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:18px;padding:clamp(16px,2.4vh,24px) clamp(16px,1.6vw,26px) clamp(16px,2.4vh,22px);
  box-shadow:0 10px 30px rgba(20,60,140,.12);border:1px solid rgba(255,255,255,.9);color:inherit;text-decoration:none}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--k);border-radius:18px 18px 0 0}
.card.verde{--k:var(--verde);--ks:var(--verde-s);--kt:var(--verde-t)}
.card.morado{--k:var(--morado);--ks:var(--morado-s);--kt:var(--morado-t)}
a.card{transition:transform .2s,box-shadow .2s}
a.card:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(20,60,140,.2)}
a.card:focus-visible{outline:3px solid var(--k);outline-offset:3px}
.bhead{display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:clamp(12px,1.4vw,20px)}
.ico{width:clamp(56px,4.8vw,76px);height:clamp(56px,4.8vw,76px);border-radius:50%;background:var(--ks);color:var(--k);display:grid;place-items:center;grid-row:1/3}
.ico svg{width:52%;height:52%}
.card h2{margin:0;font-size:clamp(1.15rem,1.75vw,1.6rem);font-weight:700;color:var(--navy);line-height:1.2}
.bline{height:2px;margin-top:10px;background:linear-gradient(90deg,var(--k),color-mix(in srgb,var(--k) 25%,transparent));border-radius:2px;opacity:.75}
.card p{margin:0;font-size:clamp(.88rem,1.05vw,1rem);line-height:1.5;color:var(--text);position:relative;z-index:1}
.chips{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1}
.chips li{background:var(--ks);color:var(--kt);font-weight:700;font-size:clamp(.78rem,.95vw,.92rem);padding:6px 14px;border-radius:999px}
.nota{display:flex;gap:8px;align-items:flex-start;font-size:.84rem;color:var(--text);position:relative;z-index:1}
.nota svg{flex:0 0 auto;width:18px;height:18px;color:var(--azul);margin-top:1px}
.pie{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;position:relative;z-index:1}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--k);color:#fff;font-weight:700;font-size:clamp(.95rem,1.2vw,1.15rem);padding:clamp(9px,1.4vh,13px) clamp(18px,1.6vw,26px);border-radius:999px;box-shadow:0 6px 16px color-mix(in srgb,var(--k) 35%,transparent);white-space:nowrap}
.btn svg{width:20px;height:20px}
.card.construccion .btn{cursor:default;box-shadow:none}
.deco{position:absolute;right:clamp(10px,1.2vw,18px);bottom:clamp(8px,1.2vh,14px);width:clamp(70px,8vw,130px);height:auto;color:var(--k);opacity:.16;pointer-events:none;z-index:0}
.card.construccion .deco{opacity:.9;width:clamp(40px,3.6vw,58px);color:var(--azul)}

/* Pie */
.lema{display:flex;align-items:center;gap:18px;margin-top:auto}
.lema img{display:block;height:clamp(46px,7vh,72px);width:auto}
.lema::after{content:"";flex:0 1 42%;height:1.5px;background:linear-gradient(90deg,#c62127,rgba(198,33,39,0))}
.error{background:#fdeaea;color:#c02e2e;border:1px solid #f5c4c4;border-radius:10px;padding:12px 16px;font-size:.9rem}

@media (max-width:1080px){.boards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){
  .boards{grid-template-columns:1fr}
  .hero{flex-direction:column;align-items:flex-start}
  .logos{order:-1}
  .sep{display:none}
  .lema::after{flex-basis:20%}
}
@media (prefers-reduced-motion:reduce){a.card,a.card:hover{transition:none;transform:none}}
</style>
<script src="config.js"></script>
</head>
<body>
<canvas id="fondo" aria-hidden="true"></canvas>

<div class="wrap">
  <header class="hero">
    <div class="tt">
      <div class="tline">
        <h1 id="titulo">Tableros comerciales P&amp;G</h1>
        <span class="sep" id="sep" hidden></span>
        <span class="per" id="per" hidden></span>
      </div>
      <p class="desc" id="desc"></p>
    </div>
    <div class="logos">
      <img class="pg" src="img/logo-pg.png" alt="P&amp;G">
      <span class="vsep" aria-hidden="true"></span>
      <img class="vega" src="img/logo-vega.png" alt="Vega">
    </div>
  </header>

  <main class="boards" id="boards"></main>

  <div class="lema" id="lema"><img src="img/logo-igen.png" alt="IGEN, Inteligencia comercial y estrategia de negocios"></div>
</div>

<script>
(() => {
  const SVG = (cuerpo, extra) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"' + (extra || '') + '>' + cuerpo + '</svg>';
  const ICONOS = {
    regalo: SVG('<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/>'),
    diana: SVG('<circle cx="11" cy="13" r="8"/><circle cx="11" cy="13" r="4.5"/><circle cx="11" cy="13" r="1.3" fill="currentColor"/><path d="M11 13l8-8M16 3.5V8h4.5"/>', ' stroke-width="2"'),
    trofeo: SVG('<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>'),
  };
  const DECO = {
    casco: '<svg class="deco" viewBox="0 0 64 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 38h52"/><path d="M10 38c0-13 9.8-24 22-24s22 11 22 24"/><path d="M26 14.5V9h12v5.5"/><path d="M32 14v12M20 18l3 8M44 18l-3 8"/><path d="M4 38c0 3 2 5 5 5h46c3 0 5-2 5-5"/></svg>',
    grafico: '<svg class="deco" viewBox="0 0 120 120" fill="currentColor" aria-hidden="true"><rect x="8" y="86" width="14" height="28" rx="2"/><rect x="32" y="70" width="14" height="44" rx="2"/><rect x="56" y="58" width="14" height="56" rx="2"/><rect x="80" y="42" width="14" height="72" rx="2"/><path d="M6 76 L40 48 L62 58 L104 16" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M86 12 L110 10 L108 34 Z"/></svg>',
    trofeo: '<svg class="deco" viewBox="0 0 120 120" fill="currentColor" aria-hidden="true"><path d="M34 20h52v26c0 16-12 28-26 28S34 62 34 46z"/><path d="M34 26H18v8c0 11 8 19 18 20v-8c-6-1-10-6-10-12v-1h8zM86 26h16v8c0 11-8 19-18 20v-8c6-1 10-6 10-12v-1h-8z"/><rect x="54" y="74" width="12" height="18"/><rect x="38" y="92" width="44" height="8" rx="2"/><rect x="32" y="100" width="56" height="10" rx="3"/><path d="M102 4l3 7 7 3-7 3-3 7-3-7-7-3 7-3zM112 26l2 4 4 2-4 2-2 4-2-4-4-2 4-2z"/></svg>',
  };
  const DECO_DE = { regalo: 'casco', diana: 'grafico', trofeo: 'trofeo' };
  const FLECHA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const INFO = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M12 11v6M12 7.5v.01" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>';
  const COLOR = { azul: '', verde: 'verde', morado: 'morado' };
  const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };

  const C = window.CONFIG;
  const cont = document.getElementById('boards');
  if (!C || !Array.isArray(C.tableros)) {
    cont.append(el('p', 'error', 'No se pudo leer config.js. Revisa que no falte una coma o unas comillas en el último cambio.'));
    return;
  }

  // Encabezado
  if (C.titulo) document.getElementById('titulo').textContent = C.titulo;
  if (C.periodo) {
    const per = String(C.periodo).replace(/'/g, '\u2019');
    const p = document.getElementById('per'); p.textContent = per; p.hidden = false;
    document.getElementById('sep').hidden = false;
    document.title = (C.titulo || 'Tableros comerciales P&G') + ' ' + per;
  }
  const d = document.getElementById('desc'); const texto = String(C.descripcion || '');
  const corte = texto.indexOf('. ');
  if (corte > 0) { d.append(el('b', null, texto.slice(0, corte + 1)), document.createTextNode(' ' + texto.slice(corte + 2))); }
  else d.textContent = texto;

  // Tarjetas
  for (const t of C.tableros) {
    const activo = t.estado !== 'construccion' && !!t.link;
    const card = el(activo ? 'a' : 'div', 'card ' + (COLOR[t.color] || '') + (activo ? '' : ' construccion'));
    if (activo) { card.href = t.link; card.target = '_blank'; card.rel = 'noopener'; }
    else card.setAttribute('aria-disabled', 'true');

    const head = el('div', 'bhead');
    const ico = el('span', 'ico'); ico.innerHTML = ICONOS[t.icono] || ICONOS.diana;
    const h2 = el('h2', null, t.nombre || '');
    head.append(ico, h2, el('span', 'bline'));
    card.append(head);

    if (t.descripcion) card.append(el('p', null, t.descripcion));
    if (Array.isArray(t.etiquetas) && t.etiquetas.length) {
      const ul = el('ul', 'chips'); for (const e of t.etiquetas) ul.append(el('li', null, e)); card.append(ul);
    }
    if (t.nota) { const n = el('div', 'nota'); n.innerHTML = INFO; n.append(el('span', null, t.nota)); card.append(n); }

    const pie = el('div', 'pie');
    const btn = el('span', 'btn');
    if (activo) { btn.append(document.createTextNode('Abrir tablero')); btn.insertAdjacentHTML('beforeend', FLECHA); }
    else { btn.insertAdjacentHTML('beforeend', FLECHA); btn.append(document.createTextNode('En construcción')); }
    pie.append(btn);
    card.append(pie);

    const deco = activo ? DECO_DE[t.icono] : 'casco';
    if (deco && DECO[deco]) card.insertAdjacentHTML('beforeend', DECO[deco]);
    cont.append(card);
  }
})();
</script>
<script>
// Fondo de triángulos: claros arriba a la izquierda, más densos y oscuros abajo a la derecha.
// Se mueven en ondas suaves y se apartan del cursor.
(() => {
  const cv = document.getElementById('fondo'); if (!cv) return;
  const cx = cv.getContext('2d');
    const quieto = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const OSC = ['#163d73', '#1f4f8f', '#2b5fa8', '#3d5a78', '#4f6b88', '#647f9a', '#7b93ab', '#1458c4'];
  const CLA = ['#d9dee5', '#e2e6ec', '#ebeef2', '#d1d7df'];
  let W = 0, H = 0, dpr = 1, tris = [], raton = { x: -9999, y: -9999 }, ultimo = 0;
  const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  const suave = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  function armar() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const lado = W < 700 ? 18 : 24, alto = lado * 0.866, paso = lado * 0.62;
    tris = []; let i = 0;
    for (let fila = -1; fila * alto * 1.18 < H + alto; fila++) {
      for (let col = -1; col * paso < W + lado; col++, i++) {
        const arriba = (fila + col) % 2 === 0;
        const x = col * paso, y = fila * alto * 1.18;
        // densidad: crece hacia abajo a la derecha, con borde irregular
        const d = suave(0.55, 1.05, (x / W) * 0.55 + (y / H) * 0.75 + (rnd(i) - 0.5) * 0.35);
        const r = rnd(i + 7.3);
        const oscuro = r < d;
        tris.push({ x, y, arriba, lado: lado * 0.78, oscuro,
          color: oscuro ? OSC[Math.floor(rnd(i + 3.1) * OSC.length)] : CLA[Math.floor(rnd(i + 5.7) * CLA.length)],
          alfa: oscuro ? 0.55 + rnd(i + 9.9) * 0.45 : 0.55 + rnd(i + 2.2) * 0.45,
          fase: rnd(i + 1.7) * Math.PI * 2, vel: 0.6 + rnd(i + 4.4) * 0.9, d });
      }
    }
  }

  function dibujar(t) {
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx.clearRect(0, 0, W, H);
    const s = t / 1000;
    for (const p of tris) {
      // onda diagonal que recorre la pantalla y aviva algunos triángulos claros
      const onda = Math.sin((p.x + p.y) / 160 - s * 0.9);
      let a = p.alfa * (p.oscuro ? 0.82 + 0.18 * Math.sin(s * p.vel + p.fase) : 0.75 + 0.25 * onda);
      let color = p.color;
      if (!p.oscuro && onda > 0.93 && p.d > 0.15) { color = OSC[(Math.floor(p.fase * 10)) % OSC.length]; a = 0.35 * p.d + 0.15; }
      // flotación suave
      let dx = Math.sin(s * p.vel + p.fase) * 1.6, dy = Math.cos(s * p.vel * 0.8 + p.fase) * 1.6;
      // se apartan del cursor y giran un poco
      const mx = p.x - raton.x, my = p.y - raton.y, dist = Math.hypot(mx, my);
      let giro = 0, esc = 1;
      if (dist < 140) { const f = (1 - dist / 140); dx += (mx / (dist || 1)) * f * 22; dy += (my / (dist || 1)) * f * 22; giro = f * 1.2; esc = 1 + f * 0.35; if (!p.oscuro) a = Math.max(a, 0.9); }
      const l = p.lado * esc, h = l * 0.866;
      cx.save();
      cx.translate(p.x + dx, p.y + dy);
      if (giro) cx.rotate(p.arriba ? giro : -giro);
      cx.globalAlpha = Math.min(1, a);
      cx.fillStyle = color;
      cx.beginPath();
      if (p.arriba) { cx.moveTo(0, -h * 0.62); cx.lineTo(l / 2, h * 0.38); cx.lineTo(-l / 2, h * 0.38); }
      else { cx.moveTo(0, h * 0.62); cx.lineTo(l / 2, -h * 0.38); cx.lineTo(-l / 2, -h * 0.38); }
      cx.closePath(); cx.fill();
      cx.restore();
    }
  }

  function bucle(t) {
    if (!document.hidden && t - ultimo > 33) { ultimo = t; dibujar(t); }
    requestAnimationFrame(bucle);
  }
  window.addEventListener('pointermove', (e) => { raton.x = e.clientX; raton.y = e.clientY; }, { passive: true });
  window.addEventListener('pointerleave', () => { raton.x = raton.y = -9999; });
  document.addEventListener('mouseleave', () => { raton.x = raton.y = -9999; });
  let tm = null;
  window.addEventListener('resize', () => { clearTimeout(tm); tm = setTimeout(() => { armar(); if (quieto) dibujar(0); }, 120); });
  armar();
  if (quieto) dibujar(0); else requestAnimationFrame(bucle);
})();

</script>
</body>
</html>
