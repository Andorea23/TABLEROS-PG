<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tableros comerciales P&amp;G</title>
<link rel="icon" href="img/logo-pg.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme:light;
  --font-anthropic-sans:"IBM Plex Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --h-bg:#ffffff;--h-soft:#f3f6fb;--h-line:#dfe5ee;--h-text:#1b2433;--h-muted:#5d687c;--h-navy:#163d73;--h-blue:#1458c4;--h-green:#2e9e4f;--h-purple:#6b3fa0;--h-red:#c02e2e;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#fff;color:var(--h-text);font-family:var(--font-anthropic-sans);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
/* Inicio */

.h-wrap{max-width:1120px;margin:0 auto;padding:18px clamp(12px,3vw,28px) 32px;display:flex;flex-direction:column;gap:18px}
.h-hero{background:linear-gradient(100deg,#0c3a8c 0%,#1458c4 60%,#1a66d6 100%);color:#fff;border-radius:12px;padding:16px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:14px 16px}
.h-ico{width:44px;height:44px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:0 0 auto}
.h-ico svg{width:24px;height:24px;color:var(--h-blue)}
.h-tt{flex:1 1 14rem}
.h-hero h1{margin:0;font-size:clamp(1.2rem,2.5vw,1.55rem);font-weight:700;letter-spacing:-.01em}
.h-hero p{margin:2px 0 0;font-size:.9rem;opacity:.9}
.h-cargar{font:inherit;font-weight:700;font-size:.9rem;display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--h-blue);border:0;border-radius:999px;padding:9px 18px;cursor:pointer}
.h-cargar:hover{background:#e9f1fd}
.h-cargar svg{width:16px;height:16px}
.h-intro{margin:0;color:var(--h-muted);font-size:.95rem}
.h-boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.h-board{--k:var(--h-blue);font:inherit;text-align:left;display:flex;flex-direction:column;background:#fff;border:1px solid var(--h-line);border-top:5px solid var(--k);border-radius:10px;padding:18px 18px 16px;color:inherit;text-decoration:none;gap:12px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.h-board:hover{border-color:var(--k);box-shadow:0 4px 16px rgba(20,50,100,.10)}
.h-board:focus-visible{outline:3px solid var(--k);outline-offset:2px}
.h-bhead{display:flex;align-items:center;gap:12px}
.h-bico{width:40px;height:40px;border-radius:9px;background:color-mix(in srgb,var(--k) 12%,#fff);color:var(--k);display:grid;place-items:center;flex:0 0 auto}
.h-bico svg{width:22px;height:22px}
.h-board h2{margin:0;font-size:1.12rem;font-weight:700;color:var(--h-navy);line-height:1.25}
.h-board p{margin:0;font-size:.92rem}
.h-board ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.h-board li{font-size:.78rem;font-weight:600;color:var(--k);background:color-mix(in srgb,var(--k) 9%,#fff);border-radius:999px;padding:3px 10px}
.h-meta{font-size:.8rem;color:var(--h-muted);min-height:1.2em}
.h-meta.warn{color:#a24f08}
.h-open{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:var(--k);color:#fff;font-weight:700;font-size:.9rem;padding:8px 16px;border-radius:999px}
.h-open svg{width:14px;height:14px}
.b-red{--k:var(--h-blue)}.b-inc{--k:var(--h-green)}.b-ct{--k:var(--h-purple)}
.h-foot{margin:0;font-size:.8rem;color:var(--h-muted)}

/* Fondo de triángulos animados de la pantalla de inicio */
#vista-inicio{position:relative;isolation:isolate}
#h-fondo{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;display:block;background:#f7f8fa}
.h-board{background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 6px 22px rgba(20,50,100,.12)}
.h-board:hover{box-shadow:0 10px 30px rgba(20,50,100,.20);transform:translateY(-2px)}
.h-board{transition:border-color .15s,box-shadow .2s,transform .2s}
.h-board.en-proceso{background:rgba(250,251,253,.88);transform:none}
.h-hero{box-shadow:0 8px 26px rgba(12,58,140,.28)}
.h-intro,.h-foot{align-self:flex-start;background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:999px;padding:5px 14px;color:var(--h-navy)}
.c-panel{box-shadow:0 6px 22px rgba(20,50,100,.12)}
@media (prefers-reduced-motion:reduce){.h-board,.h-board:hover{transition:none;transform:none}}
.h-board.en-proceso{cursor:default;border-top-color:#a9b8cf;background:#fafbfd}
.h-board.en-proceso:hover{border-color:var(--h-line);box-shadow:none}
.h-board.en-proceso .h-bico{background:#eef2f7;color:#8a96aa}
.h-board.en-proceso h2{color:#5d687c}
.h-board.en-proceso li{color:#5d687c;background:#eef2f7}
.h-proceso{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:7px;background:#fff4e5;color:#a24f08;border:1px solid #f5d3a8;font-weight:700;font-size:.85rem;padding:6px 14px;border-radius:999px}
.h-proceso::before{content:"";width:8px;height:8px;border-radius:50%;background:#ef7d22}


/* Inicio compacto */
html,body{height:100%}
#vista-inicio{min-height:100%;display:flex}
.h-wrap{width:100%;max-width:1280px;min-height:100%;padding:clamp(10px,2vh,18px) clamp(10px,2.5vw,24px);gap:clamp(10px,1.8vh,16px)}
.h-hero{padding:clamp(12px,2.2vh,20px) clamp(14px,2.5vw,26px);gap:10px 20px;align-items:center}
.h-tt{flex:1 1 18rem;min-width:0}
.h-hero h1{font-size:clamp(1.45rem,3.4vw,2.5rem);font-weight:800;text-transform:uppercase;letter-spacing:.02em;line-height:1.08}
.h-hero p{font-size:clamp(.82rem,1.3vw,.95rem);margin-top:4px}
.h-per{display:inline-block;margin-left:.25em;padding:.06em .42em;border-radius:.3em;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);font-weight:700;letter-spacing:.04em;white-space:nowrap}
.h-logos{display:flex;align-items:center;gap:clamp(10px,1.6vw,18px);flex:0 0 auto}
.h-logos img{display:block;height:clamp(40px,6vw,62px);width:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.22))}
.h-logos .lg-vega{height:clamp(30px,4.4vw,46px)}
.h-boards{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:clamp(10px,1.6vw,16px);align-items:stretch}
.h-board{padding:clamp(12px,1.8vh,16px) 16px;gap:clamp(6px,1.2vh,10px)}
.h-board h2{font-size:clamp(1rem,1.5vw,1.15rem)}
.h-board p{font-size:.88rem;line-height:1.4}
.h-bico{width:36px;height:36px}
.h-bico svg{width:20px;height:20px}
.h-board li{font-size:.74rem;padding:2px 9px}
.h-open,.h-proceso{font-size:.85rem;padding:7px 14px}
.h-foot{margin-top:auto;font-size:.74rem;padding:3px 12px}
@media (max-width:640px){
  .h-hero{flex-direction:column;align-items:flex-start}
  .h-logos{order:-1}
  .h-hero p{display:none}
  .h-cargar{align-self:stretch;justify-content:center}
  .h-board ul{display:none}
}


.h-error{background:#fdeaea;color:#c02e2e;border:1px solid #f5c4c4;border-radius:8px;padding:10px 14px;font-size:.9rem}
</style>
<script src="config.js"></script>
</head>
<body>
<div id="vista-inicio">
  <canvas id="h-fondo" aria-hidden="true"></canvas>
  <div class="h-wrap">
    <header class="h-hero">
      <div class="h-tt">
        <h1><span id="h-titulo">Tableros comerciales P&amp;G</span> <span class="h-per" id="h-per" hidden></span></h1>
        <p id="h-desc"></p>
      </div>
      <div class="h-logos"><img src="img/logo-pg.png" alt="P&amp;G" class="lg-pg"><img src="img/logo-vega.png" alt="Vega" class="lg-vega"></div>
    </header>
    <main class="h-boards" id="h-boards"></main>
    <p class="h-foot" id="h-foot"></p>
  </div>
</div>

<script>
(() => {
  const ICONOS = {
    regalo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>',
    diana: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>',
    trofeo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>',
  };
  const FLECHA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
  const COLORES = { azul: 'b-red', verde: 'b-inc', morado: 'b-ct' };
  const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
  const C = window.CONFIG;
  const cont = document.getElementById('h-boards');
  if (!C || !Array.isArray(C.tableros)) {
    cont.append(el('p', 'h-error', 'No se pudo leer config.js. Revisa que no falte una coma o unas comillas en el último cambio.'));
    return;
  }
  if (C.titulo) { document.getElementById('h-titulo').textContent = C.titulo; document.title = C.titulo + (C.periodo ? ' ' + C.periodo : ''); }
  if (C.periodo) { const p = document.getElementById('h-per'); p.textContent = String(C.periodo).replace(/'/g, '\u2019'); p.hidden = false; }
  document.getElementById('h-desc').textContent = C.descripcion || '';
  document.getElementById('h-foot').textContent = C.nota_pie || '';
  if (!C.nota_pie) document.getElementById('h-foot').hidden = true;

  for (const t of C.tableros) {
    const activo = t.estado !== 'construccion' && t.link;
    const card = el(activo ? 'a' : 'div', 'h-board ' + (COLORES[t.color] || 'b-red') + (activo ? '' : ' en-proceso'));
    if (activo) { card.href = t.link; card.target = '_blank'; card.rel = 'noopener'; }
    else card.setAttribute('aria-disabled', 'true');
    const head = el('div', 'h-bhead');
    const ico = el('span', 'h-bico'); ico.setAttribute('aria-hidden', 'true'); ico.innerHTML = ICONOS[t.icono] || ICONOS.diana;
    head.append(ico, el('h2', null, t.nombre || ''));
    card.append(head);
    if (t.descripcion) card.append(el('p', null, t.descripcion));
    if (t.etiquetas && t.etiquetas.length) { const ul = el('ul'); for (const e of t.etiquetas) ul.append(el('li', null, e)); card.append(ul); }
    if (t.nota) card.append(el('span', 'h-meta', t.nota));
    if (activo) { const b = el('span', 'h-open', 'Abrir tablero '); b.insertAdjacentHTML('beforeend', FLECHA); card.append(b); }
    else card.append(el('span', 'h-proceso', 'En construcción'));
    cont.append(card);
  }
})();
</script>
<script>
// Fondo de triángulos: claros arriba a la izquierda, más densos y oscuros abajo a la derecha.
// Se mueven en ondas suaves y se apartan del cursor.
(() => {
  const cv = document.getElementById('h-fondo'); if (!cv) return;
  const cx = cv.getContext('2d');
  const vista = document.getElementById('vista-inicio');
  const quieto = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const OSC = ['#163d73', '#1f4f8f', '#2b5fa8', '#3d5a78', '#4f6b88', '#647f9a', '#7b93ab', '#1458c4'];
  const CLA = ['#d9dee5', '#e2e6ec', '#ebeef2', '#d1d7df'];
  let W = 0, H = 0, dpr = 1, tris = [], raton = { x: -9999, y: -9999 }, ultimo = 0;
  const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  const suave = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  function armar() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const lado = W < 700 ? 18 : 24, alto = lado * 0.866, paso = lado * 0.62;
    tris = []; let i = 0;
    for (let fila = -1; fila * alto * 1.18 < H + alto; fila++) {
      for (let col = -1; col * paso < W + lado; col++, i++) {
        const arriba = (fila + col) % 2 === 0;
        const x = col * paso, y = fila * alto * 1.18;
        // densidad: crece hacia abajo a la derecha, con borde irregular
        const d = suave(0.55, 1.05, (x / W) * 0.55 + (y / H) * 0.75 + (rnd(i) - 0.5) * 0.35);
        const r = rnd(i + 7.3);
        const oscuro = r < d;
        tris.push({ x, y, arriba, lado: lado * 0.78, oscuro,
          color: oscuro ? OSC[Math.floor(rnd(i + 3.1) * OSC.length)] : CLA[Math.floor(rnd(i + 5.7) * CLA.length)],
          alfa: oscuro ? 0.55 + rnd(i + 9.9) * 0.45 : 0.55 + rnd(i + 2.2) * 0.45,
          fase: rnd(i + 1.7) * Math.PI * 2, vel: 0.6 + rnd(i + 4.4) * 0.9, d });
      }
    }
  }

  function dibujar(t) {
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx.clearRect(0, 0, W, H);
    const s = t / 1000;
    for (const p of tris) {
      // onda diagonal que recorre la pantalla y aviva algunos triángulos claros
      const onda = Math.sin((p.x + p.y) / 160 - s * 0.9);
      let a = p.alfa * (p.oscuro ? 0.82 + 0.18 * Math.sin(s * p.vel + p.fase) : 0.75 + 0.25 * onda);
      let color = p.color;
      if (!p.oscuro && onda > 0.93 && p.d > 0.15) { color = OSC[(Math.floor(p.fase * 10)) % OSC.length]; a = 0.35 * p.d + 0.15; }
      // flotación suave
      let dx = Math.sin(s * p.vel + p.fase) * 1.6, dy = Math.cos(s * p.vel * 0.8 + p.fase) * 1.6;
      // se apartan del cursor y giran un poco
      const mx = p.x - raton.x, my = p.y - raton.y, dist = Math.hypot(mx, my);
      let giro = 0, esc = 1;
      if (dist < 140) { const f = (1 - dist / 140); dx += (mx / (dist || 1)) * f * 22; dy += (my / (dist || 1)) * f * 22; giro = f * 1.2; esc = 1 + f * 0.35; if (!p.oscuro) a = Math.max(a, 0.9); }
      const l = p.lado * esc, h = l * 0.866;
      cx.save();
      cx.translate(p.x + dx, p.y + dy);
      if (giro) cx.rotate(p.arriba ? giro : -giro);
      cx.globalAlpha = Math.min(1, a);
      cx.fillStyle = color;
      cx.beginPath();
      if (p.arriba) { cx.moveTo(0, -h * 0.62); cx.lineTo(l / 2, h * 0.38); cx.lineTo(-l / 2, h * 0.38); }
      else { cx.moveTo(0, h * 0.62); cx.lineTo(l / 2, -h * 0.38); cx.lineTo(-l / 2, -h * 0.38); }
      cx.closePath(); cx.fill();
      cx.restore();
    }
  }

  function bucle(t) {
    if (!vista.hidden && !document.hidden && t - ultimo > 33) { ultimo = t; dibujar(t); }
    requestAnimationFrame(bucle);
  }
  window.addEventListener('pointermove', (e) => { raton.x = e.clientX; raton.y = e.clientY; }, { passive: true });
  window.addEventListener('pointerleave', () => { raton.x = raton.y = -9999; });
  document.addEventListener('mouseleave', () => { raton.x = raton.y = -9999; });
  let tm = null;
  window.addEventListener('resize', () => { clearTimeout(tm); tm = setTimeout(() => { armar(); if (quieto) dibujar(0); }, 120); });
  armar();
  if (quieto) dibujar(0); else requestAnimationFrame(bucle);
})();

</script>
</body>
</html>
