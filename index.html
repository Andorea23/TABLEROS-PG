<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tableros comerciales P&amp;G</title>
<link rel="icon" href="img/logo-pg.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&display=swap">
<style>
:root{
  color-scheme:light;
  --font:"IBM Plex Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --navy:#0b2f6e;--navy2:#123f8c;--text:#1f2a3c;--muted:#5d687c;
  --azul:#1366d6;--azul-s:#e3eefc;--azul-t:#1458c4;
  --verde:#1f8a3b;--verde-s:#e2f3e7;--verde-t:#1e7a3c;
  --morado:#5a2ca0;--morado-s:#ece5f8;--morado-t:#5b2f9a;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:var(--font);color:var(--text);font-size:15px;line-height:1.45;background:#eaf1fc}
[hidden]{display:none!important}

/* Fondo de triángulos animados */
#fondo{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;display:block;background:linear-gradient(180deg,#f4f7fc 0%,#edf2fb 60%,#e6eefa 100%)}
.wrap{min-height:100%;max-width:1200px;margin:0 auto;padding:clamp(12px,2.6vh,26px) clamp(12px,2.2vw,30px) clamp(14px,2.4vh,24px);display:flex;flex-direction:column;gap:clamp(16px,3.2vh,34px)}

/* Encabezado */
.hero{position:relative;overflow:hidden;border-radius:16px;color:#fff;padding:clamp(12px,2vh,18px) clamp(18px,2.6vw,34px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;
  background:linear-gradient(105deg,#0a3a8e 0%,#0f4aa8 45%,#1660cf 100%);box-shadow:0 10px 30px rgba(10,50,130,.28)}
.hero::before{content:"";position:absolute;right:-8%;top:-60%;width:46%;height:220%;border-radius:50%;background:radial-gradient(closest-side,rgba(120,180,255,.35),rgba(120,180,255,0));pointer-events:none}
.hero::after{content:"";position:absolute;right:16%;top:-40%;width:30%;height:200%;border-radius:50%;border-left:2px solid rgba(255,255,255,.12);pointer-events:none}
.tt{position:relative;z-index:1;min-width:0;flex:1 1 32rem}
.tline{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
h1{margin:0;font-size:clamp(1.2rem,2.3vw,1.95rem);font-weight:700;letter-spacing:.04em;line-height:1.05;text-transform:uppercase}
.sep{width:2px;align-self:stretch;min-height:1.6em;background:rgba(255,255,255,.55);border-radius:2px}
.per{font-size:clamp(1rem,1.9vw,1.6rem);font-weight:600;letter-spacing:.04em;line-height:1;padding:.22em .7em;border-radius:10px;background:rgba(80,140,235,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);white-space:nowrap}
.desc{margin:8px 0 0;font-size:clamp(.78rem,.95vw,.9rem);font-weight:400;opacity:.92;letter-spacing:.01em}
.desc b{font-weight:600}
.logos{position:relative;z-index:1;display:flex;align-items:center;gap:clamp(12px,1.8vw,22px);flex:0 0 auto}
.logos .pg{height:clamp(42px,4.4vw,64px);width:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
.logos .vsep{width:1.5px;height:clamp(32px,3.4vw,46px);background:rgba(255,255,255,.65);border-radius:2px}
.logos .vega{height:clamp(28px,3.2vw,44px);width:auto}

/* Tableros en filas horizontales */
.boards{display:flex;flex-direction:column;gap:clamp(8px,1.6vh,14px);width:100%;margin:auto 0}
.card{--k:var(--azul);--ks:var(--azul-s);--kt:var(--azul-t);position:relative;display:flex;align-items:center;gap:clamp(12px,1.6vw,22px);
  background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:18px;
  padding:clamp(10px,1.6vh,14px) clamp(14px,1.8vw,24px);border-left:5px solid var(--k);box-shadow:0 4px 18px rgba(20,60,140,.09);color:inherit;text-decoration:none}
.card.verde{--k:var(--verde);--ks:var(--verde-s);--kt:var(--verde-t)}
.card.morado{--k:var(--morado);--ks:var(--morado-s);--kt:var(--morado-t)}
a.card{transition:transform .2s,box-shadow .2s}
a.card:hover{transform:translateX(4px);box-shadow:0 16px 38px rgba(20,60,140,.2)}
a.card:focus-visible{outline:3px solid var(--k);outline-offset:3px}
.ico{flex:0 0 auto;width:clamp(42px,3.4vw,52px);height:clamp(42px,3.4vw,52px);border-radius:50%;background:var(--ks);color:var(--k);display:grid;place-items:center}
.ico svg{width:52%;height:52%}
.info{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px}
.card h2{margin:0;font-size:clamp(.98rem,1.35vw,1.2rem);font-weight:600;color:var(--navy);line-height:1.2;letter-spacing:.005em}
.chips{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.chips li{background:var(--ks);color:var(--kt);font-weight:500;font-size:clamp(.7rem,.8vw,.78rem);padding:2px 10px;border-radius:999px;letter-spacing:.01em}
.btn{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;background:var(--k);color:#fff;font-weight:600;font-size:clamp(.8rem,.95vw,.9rem);padding:8px 18px;border-radius:999px;box-shadow:0 3px 10px color-mix(in srgb,var(--k) 28%,transparent);white-space:nowrap}
.btn svg{width:16px;height:16px}
.card.construccion .btn{cursor:default;box-shadow:none}

/* Pie */
.lema{display:flex;align-items:center;gap:18px;margin-top:auto}
.lema img{display:block;height:clamp(36px,5.2vh,54px);width:auto}
.lema::after{content:"";flex:0 1 42%;height:1.5px;background:linear-gradient(90deg,#c62127,rgba(198,33,39,0))}
.error{background:#fdeaea;color:#c02e2e;border:1px solid #f5c4c4;border-radius:10px;padding:12px 16px;font-size:.9rem}

@media (max-width:720px){
  .card{flex-wrap:wrap}
  .info{flex-basis:calc(100% - 90px)}
  .btn{width:100%;justify-content:center}
  .hero{flex-direction:column;align-items:flex-start}
  .logos{order:-1}
  .sep{display:none}
  .lema::after{flex-basis:20%}
}
@media (prefers-reduced-motion:reduce){a.card,a.card:hover{transition:none;transform:none}}
</style>
<script src="config.js"></script>
</head>

<script>
(() => {
  const SVG = (cuerpo, extra) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"' + (extra || '') + '>' + cuerpo + '</svg>';
  const ICONOS = {
    regalo: SVG('<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/>'),
    diana: SVG('<circle cx="11" cy="13" r="8"/><circle cx="11" cy="13" r="4.5"/><circle cx="11" cy="13" r="1.3" fill="currentColor"/><path d="M11 13l8-8M16 3.5V8h4.5"/>', ' stroke-width="2"'),
    trofeo: SVG('<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>'),
  };
  const FLECHA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const COLOR = { azul: '', verde: 'verde', morado: 'morado' };
  const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };

  const C = window.CONFIG;
  const cont = document.getElementById('boards');
  if (!C || !Array.isArray(C.tableros)) {
    cont.append(el('p', 'error', 'No se pudo leer config.js. Revisa que no falte una coma o unas comillas en el último cambio.'));
    return;
  }

  // Encabezado
  if (C.titulo) document.getElementById('titulo').textContent = C.titulo;
  if (C.periodo) {
    const per = String(C.periodo).replace(/'/g, '\u2019');
    const p = document.getElementById('per'); p.textContent = per; p.hidden = false;
    document.getElementById('sep').hidden = false;
    document.title = (C.titulo || 'Tableros comerciales P&G') + ' ' + per;
  }
  const d = document.getElementById('desc'); const texto = String(C.descripcion || '');
  const corte = texto.indexOf('. ');
  if (corte > 0) { d.append(el('b', null, texto.slice(0, corte + 1)), document.createTextNode(' ' + texto.slice(corte + 2))); }
  else d.textContent = texto;

  // Tableros: ícono, nombre con etiquetas y botón
  for (const t of C.tableros) {
    const activo = t.estado !== 'construccion' && !!t.link;
    const card = el(activo ? 'a' : 'div', 'card ' + (COLOR[t.color] || '') + (activo ? '' : ' construccion'));
    if (activo) { card.href = t.link; card.target = '_blank'; card.rel = 'noopener'; }
    else card.setAttribute('aria-disabled', 'true');
    const ico = el('span', 'ico'); ico.innerHTML = ICONOS[t.icono] || ICONOS.diana;
    const btn = el('span', 'btn');
    if (activo) { btn.append(document.createTextNode('Abrir tablero')); btn.insertAdjacentHTML('beforeend', FLECHA); }
    else btn.append(document.createTextNode('En construcción'));
    const info = el('div', 'info');
    info.append(el('h2', null, t.nombre || ''));
    if (Array.isArray(t.etiquetas) && t.etiquetas.length) { const ul = el('ul', 'chips'); for (const e of t.etiquetas) ul.append(el('li', null, e)); info.append(ul); }
    card.append(ico, info, btn);
    cont.append(card);
  }
})();
</script>
<script>
// Fondo de triángulos: claros arriba a la izquierda, más densos y oscuros abajo a la derecha.
// Se mueven en ondas suaves y se apartan del cursor.
(() => {
  const cv = document.getElementById('fondo'); if (!cv) return;
  const cx = cv.getContext('2d');
    const quieto = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const OSC = ['#163d73', '#1f4f8f', '#2b5fa8', '#3d5a78', '#4f6b88', '#647f9a', '#7b93ab', '#1458c4'];
  const CLA = ['#d9dee5', '#e2e6ec', '#ebeef2', '#d1d7df'];
  let W = 0, H = 0, dpr = 1, tris = [], raton = { x: -9999, y: -9999 }, ultimo = 0;
  const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  const suave = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  function armar() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const lado = W < 700 ? 18 : 24, alto = lado * 0.866, paso = lado * 0.62;
    tris = []; let i = 0;
    for (let fila = -1; fila * alto * 1.18 < H + alto; fila++) {
      for (let col = -1; col * paso < W + lado; col++, i++) {
        const arriba = (fila + col) % 2 === 0;
        const x = col * paso, y = fila * alto * 1.18;
        // densidad: crece hacia abajo a la derecha, con borde irregular
        const d = suave(0.55, 1.05, (x / W) * 0.55 + (y / H) * 0.75 + (rnd(i) - 0.5) * 0.35);
        const r = rnd(i + 7.3);
        const oscuro = r < d;
        tris.push({ x, y, arriba, lado: lado * 0.78, oscuro,
          color: oscuro ? OSC[Math.floor(rnd(i + 3.1) * OSC.length)] : CLA[Math.floor(rnd(i + 5.7) * CLA.length)],
          alfa: oscuro ? 0.55 + rnd(i + 9.9) * 0.45 : 0.55 + rnd(i + 2.2) * 0.45,
          fase: rnd(i + 1.7) * Math.PI * 2, vel: 0.6 + rnd(i + 4.4) * 0.9, d });
      }
    }
  }

  function dibujar(t) {
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx.clearRect(0, 0, W, H);
    const s = t / 1000;
    for (const p of tris) {
      // onda diagonal que recorre la pantalla y aviva algunos triángulos claros
      const onda = Math.sin((p.x + p.y) / 160 - s * 0.9);
      let a = p.alfa * (p.oscuro ? 0.82 + 0.18 * Math.sin(s * p.vel + p.fase) : 0.75 + 0.25 * onda);
      let color = p.color;
      if (!p.oscuro && onda > 0.93 && p.d > 0.15) { color = OSC[(Math.floor(p.fase * 10)) % OSC.length]; a = 0.35 * p.d + 0.15; }
      // flotación suave
      let dx = Math.sin(s * p.vel + p.fase) * 1.6, dy = Math.cos(s * p.vel * 0.8 + p.fase) * 1.6;
      // se apartan del cursor y giran un poco
      const mx = p.x - raton.x, my = p.y - raton.y, dist = Math.hypot(mx, my);
      let giro = 0, esc = 1;
      if (dist < 140) { const f = (1 - dist / 140); dx += (mx / (dist || 1)) * f * 22; dy += (my / (dist || 1)) * f * 22; giro = f * 1.2; esc = 1 + f * 0.35; if (!p.oscuro) a = Math.max(a, 0.9); }
      const l = p.lado * esc, h = l * 0.866;
      cx.save();
      cx.translate(p.x + dx, p.y + dy);
      if (giro) cx.rotate(p.arriba ? giro : -giro);
      cx.globalAlpha = Math.min(1, a);
      cx.fillStyle = color;
      cx.beginPath();
      if (p.arriba) { cx.moveTo(0, -h * 0.62); cx.lineTo(l / 2, h * 0.38); cx.lineTo(-l / 2, h * 0.38); }
      else { cx.moveTo(0, h * 0.62); cx.lineTo(l / 2, -h * 0.38); cx.lineTo(-l / 2, -h * 0.38); }
      cx.closePath(); cx.fill();
      cx.restore();
    }
  }

  function bucle(t) {
    if (!document.hidden && t - ultimo > 33) { ultimo = t; dibujar(t); }
    requestAnimationFrame(bucle);
  }
  window.addEventListener('pointermove', (e) => { raton.x = e.clientX; raton.y = e.clientY; }, { passive: true });
  window.addEventListener('pointerleave', () => { raton.x = raton.y = -9999; });
  document.addEventListener('mouseleave', () => { raton.x = raton.y = -9999; });
  let tm = null;
  window.addEventListener('resize', () => { clearTimeout(tm); tm = setTimeout(() => { armar(); if (quieto) dibujar(0); }, 120); });
  armar();
  if (quieto) dibujar(0); else requestAnimationFrame(bucle);
})();

</script>
